<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>上傳照片</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 500px;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h2 {
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    p {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }

    #fileInput {
      display: none;
    }

    .btn-add {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #2563eb;
      color: white;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }

    .btn-add:hover {
      background-color: #1d4ed8;
    }

    .preview-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 24px;
    }

    .preview-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn-upload {
      display: none;
      width: 100%;
      margin-top: 24px;
      background-color: #10b981;
      color: white;
      padding: 12px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-upload:hover {
      background-color: #059669;
    }

    .btn-upload:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }

    #statusMessage {
      margin-top: 16px;
      font-size: 14px;
      font-weight: 500;
    }

    .text-success { color: #10b981; }
    .text-error { color: #ef4444; }
  </style>
</head>
<body>

  <div class="card">
    <h2>上傳照片</h2>
    <p>Select multiple images to upload directly.</p>

    <input type="file" id="fileInput" accept="image/*" multiple />

    <label for="fileInput" class="btn-add">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
      </svg>
      選擇照片
    </label>

    <div class="preview-container" id="previewContainer"></div>

    <button class="btn-upload" id="uploadBtn">Upload Photos</button>
    <div id="statusMessage"></div>
  </div>

  <script>
    // ==========================================
    // 1. CONFIGURE YOUR CLOUDINARY CREDENTIALS
    // ==========================================
    const CLOUD_NAME = "tuqkgero";       // e.g., "dxy123abc"
    const UPLOAD_PRESET = "Wall-Photo"; // e.g., "my_photo_uploads"
    // ==========================================

    const fileInput = document.getElementById('fileInput');
    const previewContainer = document.getElementById('previewContainer');
    const uploadBtn = document.getElementById('uploadBtn');
    const statusMessage = document.getElementById('statusMessage');

    let selectedFiles = [];

    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      selectedFiles = selectedFiles.concat(files);
      renderPreviews();
      statusMessage.textContent = '';
    });

    function renderPreviews() {
      previewContainer.innerHTML = '';

      selectedFiles.forEach((file) => {
        const div = document.createElement('div');
        div.className = 'preview-item';

        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        div.appendChild(img);

        previewContainer.appendChild(div);
      });

      if (selectedFiles.length > 0) {
        uploadBtn.style.display = 'block';
        uploadBtn.textContent = `Upload ${selectedFiles.length} Photo${selectedFiles.length > 1 ? 's' : ''}`;
      } else {
        uploadBtn.style.display = 'none';
      }
    }

    uploadBtn.addEventListener('click', async () => {
      if (selectedFiles.length === 0) return;

      uploadBtn.disabled = true;
      statusMessage.className = '';
      statusMessage.textContent = '開始上傳...';

      let successCount = 0;
      let failCount = 0;

      for (let i = 0; i < selectedFiles.length; i++) {
        const file = selectedFiles[i];
        statusMessage.textContent = `Uploading photo ${i + 1} of ${selectedFiles.length}...`;

        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', UPLOAD_PRESET);

        try {
          const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
            method: 'POST',
            body: formData
          });

          if (!response.ok) {
            const errData = await response.json();
            throw new Error(errData.error?.message || '上傳失敗');
          }

          successCount++;
        } catch (error) {
          console.error(`Error uploading ${file.name}:`, error);
          failCount++;
        }
      }

      uploadBtn.disabled = false;

      if (failCount === 0) {
        statusMessage.className = 'text-success';
        statusMessage.textContent = `所有 ${successCount} 照片上傳成功,謝謝!`;
        selectedFiles = [];
        fileInput.value = '';
        renderPreviews();
      } else {
        statusMessage.className = 'text-error';
        statusMessage.textContent = `Uploaded ${successCount} photos, ${failCount} failed. Check console for details.`;
      }
    });
  </script>

</body>
</html>
